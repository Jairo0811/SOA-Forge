name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - feat/phases-1-2-akana-core
      - feat/phases-3-5-gateway-governance-portal

jobs:
  documentation:
    name: Documentation integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required project files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/ROADMAP.md
          test -f docs/academic/ISO-810/README.md
          test -f docs/academic/ISO-810/DEMO-SCRIPT.md
          test -f docs/academic/ISO-810/PRESENTATION-OUTLINE.md
          test -f docs/architecture/README.md
          test -f docs/architecture/PHASE-2-CORE-SERVICES.md
          test -f docs/architecture/PHASE-3-5-GATEWAY-GOVERNANCE-PORTAL.md
          test -f docs/architecture/PHASE-6-500-USER-SCENARIO.md
          test -f docs/architecture/FINAL-ARCHITECTURE.md
          test -f docs/research/AKANA-SOA-RESEARCH.md
          test -f docs/governance/POLICIES.md
          test -f docs/governance/AKANA-MAPPING.md
          test -f docs/presentation/SOAForge-ISO810-Akana-SOA.md
          test -f docs/DELIVERY-CHECKLIST.md
          test -f docs/release/ACADEMIC-RELEASE.md
          test -f infrastructure/500-user-topology.md
          test -f src/Gateway/SOAForge.Gateway.csproj
          test -f src/Portal/package.json
          test -f tests/README.md
          test -f SOAForge.slnx

      - name: Validate UNAPEC ISO-810 scope
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "## 🎓 Información académica" README.md
          grep -Fq "### 👥 Equipo" README.md
          grep -Fq "## 🧱 Stack implementado" README.md
          grep -Fq "## 🗺️ Roadmap" README.md
          grep -Fq "ISO-810" README.md
          grep -Fq "Akana SOA" README.md
          if grep -Fq "ISO-815" README.md; then
            echo "README must remain scoped to ISO-810 only."
            exit 1
          fi

  dotnet:
    name: .NET build, tests and gateway smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SOAForge.slnx

      - name: Build
        run: dotnet build SOAForge.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test SOAForge.slnx --configuration Release --no-build --verbosity normal

      - name: Runtime smoke through API Gateway
        shell: bash
        run: |
          set -euo pipefail

          pids=()
          start_service() {
            local name="$1"
            local port="$2"
            local project="$3"
            ASPNETCORE_URLS="http://127.0.0.1:${port}" \
              dotnet run --project "$project" --configuration Release --no-build --no-launch-profile \
              > "/tmp/${name}.log" 2>&1 &
            pids+=("$!")
          }

          cleanup() {
            if [ "${#pids[@]}" -gt 0 ]; then
              kill "${pids[@]}" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          wait_for() {
            local url="$1"
            local log="$2"
            for _ in {1..40}; do
              if curl -fsS "$url" >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            echo "Service did not become ready: $url"
            cat "$log" || true
            return 1
          }

          start_service customer 5101 src/Services/CustomerService/CustomerService.csproj
          start_service order 5102 src/Services/OrderService/OrderService.csproj
          start_service payment 5103 src/Services/PaymentService/PaymentService.csproj

          wait_for http://127.0.0.1:5101/health /tmp/customer.log
          wait_for http://127.0.0.1:5102/health /tmp/order.log
          wait_for http://127.0.0.1:5103/health /tmp/payment.log

          start_service gateway 5100 src/Gateway/SOAForge.Gateway.csproj
          wait_for http://127.0.0.1:5100/health /tmp/gateway.log

          token="$(curl -fsS -X POST http://127.0.0.1:5100/auth/token \
            -H 'Content-Type: application/json' \
            -d '{"username":"demo","password":"SOAForge2026!"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')"

          auth_header="Authorization: Bearer ${token}"

          curl -fsS http://127.0.0.1:5100/api/v1/customers \
            -H "$auth_header" \
            -H 'X-Correlation-ID: ci-customers' \
            | grep -Fq 'ana@novacommerce.local'

          order_json="$(curl -fsS -X POST http://127.0.0.1:5100/api/v1/orders \
            -H "$auth_header" \
            -H 'Content-Type: application/json' \
            -H 'X-Correlation-ID: ci-order' \
            -d '{"customerId":"11111111-1111-1111-1111-111111111111","total":1500}')"

          order_id="$(printf '%s' "$order_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"

          curl -fsS -X POST http://127.0.0.1:5100/api/v1/payments \
            -H "$auth_header" \
            -H 'Content-Type: application/json' \
            -H 'X-Correlation-ID: ci-payment' \
            -d "{\"orderId\":\"${order_id}\",\"amount\":1500}" \
            | grep -Fq 'Approved'

          curl -fsS http://127.0.0.1:5100/health/services \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["isHealthy"] is True; assert len(data["services"]) == 3'

          curl -fsS http://127.0.0.1:5100/observability/metrics \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["totalRequests"] >= 5'

  portal:
    name: React portal build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
