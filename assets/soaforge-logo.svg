<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SOAForge — Enterprise Application Integration Lab</title>
  <desc id="desc">SOAForge brand banner with a central integration gateway and connected enterprise service nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020817"/>
      <stop offset="0.52" stop-color="#07172b"/>
      <stop offset="1" stop-color="#01040b"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8f2ff"/>
      <stop offset="0.45" stop-color="#4fb7ff"/>
      <stop offset="1" stop-color="#15508d"/>
    </linearGradient>
    <linearGradient id="forge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe073"/>
      <stop offset="0.55" stop-color="#ffad20"/>
      <stop offset="1" stop-color="#dc6c00"/>
    </linearGradient>
    <filter id="cyanGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="goldGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="360" r="300" fill="#0b2c4b" opacity="0.16"/>
  <circle cx="800" cy="360" r="235" fill="#0d3459" opacity="0.12"/>

  <!-- Hexagonal integration shield -->
  <polygon points="800,92 1035,227 1035,497 800,632 565,497 565,227" fill="#061426" stroke="url(#steel)" stroke-width="10"/>
  <polygon points="800,124 1006,243 1006,481 800,600 594,481 594,243" fill="none" stroke="#145d94" stroke-width="3" opacity="0.75"/>

  <!-- Connection paths -->
  <g fill="none" stroke="#28c7ff" stroke-width="8" stroke-linecap="round" filter="url(#cyanGlow)" opacity="0.9">
    <path d="M742 312 C685 312 682 247 628 247"/>
    <path d="M742 350 H628"/>
    <path d="M742 388 C685 388 682 453 628 453"/>
    <path d="M858 312 C915 312 918 247 972 247"/>
    <path d="M858 350 H972"/>
    <path d="M858 388 C915 388 918 453 972 453"/>
  </g>

  <!-- Gateway -->
  <g filter="url(#goldGlow)">
    <path d="M764 265 L800 240 L836 265 V455 L800 500 L764 455 Z" fill="#172030" stroke="url(#forge)" stroke-width="6"/>
    <rect x="785" y="282" width="30" height="164" rx="8" fill="url(#forge)"/>
    <path d="M800 446 L758 526 H842 Z" fill="#ffae1b" opacity="0.55"/>
  </g>

  <!-- Service nodes -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">
    <g transform="translate(600 215)"><circle r="48" fill="#07182b" stroke="#39caff" stroke-width="5"/><text y="10" fill="#dff7ff">☁</text></g>
    <g transform="translate(600 350)"><circle r="48" fill="#07182b" stroke="#39caff" stroke-width="5"/><text y="10" fill="#dff7ff">API</text></g>
    <g transform="translate(600 485)"><circle r="48" fill="#07182b" stroke="#39caff" stroke-width="5"/><text y="10" fill="#dff7ff">DB</text></g>
    <g transform="translate(1000 215)"><circle r="48" fill="#07182b" stroke="#39caff" stroke-width="5"/><text y="10" fill="#dff7ff">&lt;/&gt;</text></g>
    <g transform="translate(1000 350)"><circle r="48" fill="#07182b" stroke="#39caff" stroke-width="5"/><text y="10" fill="#dff7ff">SOA</text></g>
    <g transform="translate(1000 485)"><circle r="48" fill="#07182b" stroke="#39caff" stroke-width="5"/><text y="10" fill="#dff7ff">ENT</text></g>
  </g>

  <!-- Wordmark -->
  <text x="800" y="716" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="122" font-weight="800" letter-spacing="-5">
    <tspan fill="url(#steel)">SOA</tspan><tspan fill="url(#forge)">Forge</tspan>
  </text>
  <text x="800" y="775" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600" letter-spacing="9" fill="#d7eaff">ENTERPRISE APPLICATION INTEGRATION LAB</text>
  <line x1="350" y1="815" x2="1250" y2="815" stroke="#1f6e9f" stroke-width="2"/>
  <text x="800" y="854" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" letter-spacing="8" fill="#d2e6f5">CONNECT  •  INTEGRATE  •  BUILD  •  BEYOND</text>
</svg>
